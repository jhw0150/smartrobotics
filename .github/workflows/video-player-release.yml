name: Video player release

# 플레이어 소스가 바뀌어 푸시되면 Windows에서 설치 파일을 빌드하고 실제로 설치·재생까지 시험한다.
# video-player-v* 태그가 올라오면 그 태그의 릴리스에 설치 파일을 첨부한다.
on:
  push:
    tags:
      - 'video-player-v*'
    branches:
      - main
      - claude/video-player
    paths:
      - 'video-player/**'
      - '.github/workflows/video-player-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video-player
    steps:
      - uses: actions/checkout@v4

      # 재생 엔진(mpv)과 화면 조작부(uosc)를 각 프로젝트의 최신 릴리스에서 받는다.
      - name: Download mpv and uosc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/fetch-deps.sh

      - name: Smoke test (config, scripts, codecs)
        shell: bash
        run: bash build/smoke-test.sh

      # Chocolatey 서버가 가끔 503을 내므로 몇 번 다시 시도한다.
      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($i = 1; $i -le 5 -and -not (Test-Path $makensis); $i++) {
            choco install nsis -y --no-progress
            if (-not (Test-Path $makensis)) { Start-Sleep -Seconds 20 }
          }
          if (-not (Test-Path $makensis)) { throw 'NSIS 설치 실패' }

      - name: Build installer
        run: node build/make-installer.js

      - name: Installer test (install, file associations, uninstall)
        shell: pwsh
        run: ./build/installer-test.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Setup
          path: video-player/dist/VideoPlayer-Setup-*.exe
          if-no-files-found: error

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            video-player/dist/smoke/*.out
            video-player/dist/smoke/*.log
            video-player/dist/smoke/*.play
            video-player/dist/smoke/*.enc
          if-no-files-found: ignore

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: video-player/dist/VideoPlayer-Setup-*.exe
