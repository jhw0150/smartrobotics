name: Video player release

# video-player-v* 태그가 올라오면 Windows에서 설치 파일을 빌드해 그 태그의 릴리스에 첨부한다.
# 플레이어 소스가 바뀌어 푸시되면 설치 파일을 빌드해 실행 결과(Artifacts)에 올린다.
on:
  push:
    tags:
      - 'video-player-v*'
    branches:
      - main
      - claude/video-player
    paths:
      - 'video-player/**'
      - '.github/workflows/video-player-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: video-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-player/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ffmpeg.exe는 GitHub 파일 크기 제한(100MB)을 넘어서 저장소에 없으므로 빌드할 때 받는다.
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item ffmpeg-tmp/*/bin/ffmpeg.exe vendor/ffmpeg/
          Copy-Item ffmpeg-tmp/*/LICENSE.txt vendor/ffmpeg/
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-tmp

      # Chocolatey 서버가 가끔 503을 내므로 몇 번 다시 시도한다.
      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($i = 1; $i -le 5 -and -not (Test-Path $makensis); $i++) {
            choco install nsis -y --no-progress
            if (-not (Test-Path $makensis)) { Start-Sleep -Seconds 20 }
          }
          if (-not (Test-Path $makensis)) { throw 'NSIS 설치 실패' }

      - name: Build installer
        run: npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Setup
          path: video-player/dist/VideoPlayer-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: video-player/dist/VideoPlayer-Setup-*.exe
