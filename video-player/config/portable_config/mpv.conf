# 동영상 플레이어 설정 (재생 엔진: mpv)

# --- 성능: 최소한의 자원으로 재생 ---
# 그래픽카드로 영상을 푼다. 그래픽카드가 지원하지 않는 코덱은 자동으로 CPU로 푼다.
hwdec=auto-safe
# 고급 화질 보정을 끄고 가장 가벼운 화면 처리만 쓴다.
profile=fast
# 미리 읽어 두는 양을 제한해 메모리를 적게 쓴다.
demuxer-max-bytes=50MiB
demuxer-max-back-bytes=20MiB

# --- 동작 ---
# 파일 없이 실행해도 창을 띄우고, 재생이 끝나도 창을 닫지 않는다.
idle=yes
force-window=yes
keep-open=yes
# 닫을 때 보던 위치를 기억했다가 다음에 이어서 재생한다.
save-position-on-quit=yes
volume-max=150
title=${?media-title:${media-title} - }동영상 플레이어
screenshot-directory=~~desktop/

# --- 자막 ---
# 동영상과 이름이 비슷한 자막 파일을 자동으로 불러온다.
sub-auto=fuzzy
# UTF-8이 아닌 자막은 한국어 CP949로 읽는다.
sub-codepage=cp949
slang=ko,kor,korean
sub-font="Malgun Gothic"
osd-font="Malgun Gothic"

# --- 화면 조작부(uosc)를 쓰므로 기본 조작부는 끈다 ---
osc=no
osd-bar=no
